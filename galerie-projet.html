<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css?family=Roboto" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

    <link rel="stylesheet" href="./styles/gallery.css">

    <title>Galerie projets</title>
</head>

<body id="gallery-app">

    <nav class="gallery-nav">
        <a href="./index.html#projets" class="btn-retour" aria-label="Retour à l’accueil">
            ← Retour
        </a>
    </nav>

    <main id="galeriePortraits">

        <!-- boutons mode -->
        <div class="galerie-controles" v-if="processusArr.length">

            <button class="btnControles" @click="setMode('gallery')">
                Galerie
            </button>

            <button class="btnControles" @click="setMode('processus')">
                Processus
            </button>

        </div>

        <div class="frame">

            <!-- Galerie normale -->
            <img v-if="mode === 'gallery' && imagesArr.length > 0" :src="imagesArr[index]?.src" class="galerie-img" />

            <!-- Processus -->
            <img v-if="mode === 'processus' && processusArr.length > 0" :src="processusArr[index]?.src"
                class="galerie-img" />

        </div>

        <!-- titre processus -->
        <h2 v-if="mode === 'processus' && processusArr[index]?.title">
            {{ processusArr[index].title }}
        </h2>

        <!-- description galerie -->
        <p v-if="mode === 'gallery' && imagesArr[index]?.desc" class="galerie-desc">
            {{ imagesArr[index].desc }}
        </p>

        <!-- description processus -->
        <p v-if="mode === 'processus' && processusArr[index]?.desc" class="galerie-desc">
            {{ processusArr[index].desc }}
        </p>

        <!-- navigation -->
        <div class="galerie-controles">

            <button class="btnControles" @click="prevImg">
                ◀ Précédente
            </button>

            <button class="btnControles" @click="nextImg">
                Suivante ▶
            </button>

        </div>

    </main>

    <!-- scripts -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

    <script src="./scripts/main.js"></script>

</body>

</html>
